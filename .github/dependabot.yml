version: 2
# Commit titles carry a gitmoji like the rest of the history: `⬆️ build(deps): …`, `👷 ci(deps): …`
updates:
  - package-ecosystem: npm
    directory: /
    commit-message: { prefix: "⬆️ build", include: scope }
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the oldest supported Node (engines: >=22), not the newest
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    commit-message: { prefix: "👷 ci", include: scope }
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    commit-message: { prefix: "⬆️ build", include: scope }
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node LTS lines only: move the image to the next LTS by hand
      - dependency-name: node
        update-types: [version-update:semver-major]
