name: Feature request
description: Something Tourwright should be able to do.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New step action
        - Voice / TTS engine
        - Audio
        - Slides
        - API / queue
        - MCP / agents
        - Deployment
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The video you want to make and what stops you today.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: The script you would like to write
      description: Write it as if the feature already existed. This is the most useful part.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: What you do now, or other ways it could work.
