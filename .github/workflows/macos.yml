# Everything on macOS: the tests and a real render. GitHub's macOS runners are scarce: on every change a job often
# waited 15 minutes without getting one and was cancelled, turning CI red with nothing broken. So macOS runs here,
# once a day on main, for each published release, and by hand (Actions → macos → Run workflow); a job that finds
# no runner tries again the next day, and GitHub emails when one fails.
name: macos
on:
  schedule:
    - cron: "0 6 * * *"
  release:
    types: [published]
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  render:
    uses: ./.github/workflows/render.yml
    with: { os: macos-latest, capture: screencast }
