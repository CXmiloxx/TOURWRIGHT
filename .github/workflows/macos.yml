# Everything on macOS: the tests and a real render. GitHub's macOS runners are scarce: a job often waits a long
# time for one, and then takes about ten minutes, so it only runs by hand (Actions → macos → Run workflow), for
# instance before a release that touches capture, ffmpeg or the install.
name: macos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  render:
    uses: ./.github/workflows/render.yml
    with: { os: macos-latest, capture: screencast }
