name: ci
on:
  push: { branches: [main] }
  pull_request:
# A newer push to the same branch makes the older run pointless: it is cancelled instead of waiting for runners
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/check-schema.js
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        # macOS runners are scarce (jobs wait and get cancelled): every Node version runs on Linux and Windows,
        # macOS runs the oldest supported one, and its real render below
        exclude:
          - { os: macos-latest, node: 24 }
          - { os: macos-latest, node: 26 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
  # A real install and real videos on each system: `tourwright install` + slides + a browser walkthrough
  render:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, capture: screen }
          - { os: macos-latest, capture: screencast }
          - { os: windows-latest, capture: screencast }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # No static ffmpeg build for macOS: Homebrew's, as the installer tells users
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm ci
      - run: node bin/tourwright.js install --voices es_MX-claude-high,en_US-lessac-medium --no-edge
      - if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium
      - run: node bin/tourwright.js render examples/slides.yaml --out out/
      - run: node bin/tourwright.js render examples/example-com.yaml --voice lessac --capture ${{ matrix.capture }} --out out/
      # A real app, served here: login with a 2FA code, masked data, an upload, a long process, a live notice.
      # `check` fails the job naming the broken step (and fills the job summary); then the video is made.
      - name: Demo app, end to end
        shell: bash
        env:
          TOURWRIGHT_SECRET_ACME_USER: demo@acme.test
          TOURWRIGHT_SECRET_ACME_PASSWORD: demo123
          TOURWRIGHT_SECRET_ACME_TOTP: JBSWY3DPEHPK3PXP
        run: |
          node examples/app/server.js &
          sleep 1
          node bin/tourwright.js check examples/app.yaml examples/example-com.yaml examples/features.yaml
          node bin/tourwright.js render examples/app.yaml --capture ${{ matrix.capture }} --out out/
      - uses: actions/upload-artifact@v7
        with: { name: "videos-${{ matrix.os }}", path: out/ }
  image:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Image names must be lowercase, whatever the case of the repository's name
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:latest
