name: ci
on:
  push: { branches: [main] }
  pull_request:
# A newer push to the same branch makes the older run pointless: it is cancelled instead of waiting for runners
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/check-schema.js
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        # macOS runners are scarce (jobs wait and get cancelled): every Node version runs on Linux and Windows,
        # macOS runs the oldest supported one, and its real render below
        exclude:
          - { os: macos-latest, node: 24 }
          - { os: macos-latest, node: 26 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
  # The GitHub Action (action.yml) as users run it: the published package checks a script
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with: { scripts: examples/example-com.yaml, command: check, voices: en_US-lessac-medium }
  # A real install and real videos on Linux and Windows (render.yml); macOS runs daily and for releases (macos.yml)
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, capture: screen }
          - { os: windows-latest, capture: screencast }
    uses: ./.github/workflows/render.yml
    with: { os: "${{ matrix.os }}", capture: "${{ matrix.capture }}" }
