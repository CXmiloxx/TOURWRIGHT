# Tourwright as a GitHub Action: render your product tours on every change, or check that they still work
# against the deployed app (a renamed button fails the job naming the step, and the job summary shows the fix).
#
#   - uses: CXmiloxx/tourwright@v2
#     with:
#       scripts: videos/*.yaml
#       command: check          # or render (default), or guide
#
# command: guide rebuilds each script's step-by-step guide (HTML, Markdown; PDF and Word with `export`) in `out`
# and compares it with the one already there: the job log lists the steps that changed on screen. Commit `out`
# (or open a pull request with it) and the guide follows the app.
#
# Secrets for the scripts (${secret:NAME}) come from the environment: env: { TOURWRIGHT_SECRET_NAME: ... }
name: Tourwright
description: Render scripted, narrated product tour videos, or check that they still match your app
author: CXmiloxx
branding:
  icon: video
  color: blue
inputs:
  scripts:
    description: Scripts to use (paths or globs, separated by spaces or new lines)
    required: true
  command:
    description: "render: make the videos; check: dry-run each script and report every broken step; guide: rebuild the guides and say which steps changed"
    default: render
  export:
    description: "What to deliver, separated by commas: video, audio, silent, guide, pdf, docx (render); pdf, docx (guide). Empty uses each script's own"
    default: ""
  fail-on-change:
    description: "guide: fail the job when a step of a guide changed on screen, was added or removed"
    default: "false"
  out:
    description: Folder for the videos (render)
    default: videos
  voice:
    description: Voice for every script (see `tourwright voices`); empty uses each script's own
    default: ""
  quality:
    description: sd, hd, fullhd, vertical or square; empty uses each script's own
    default: ""
  voices:
    description: Offline Piper voices to install, separated by commas
    default: es_MX-claude-high,en_US-lessac-medium
  version:
    description: Tourwright version from npm
    default: latest
  upload:
    description: Upload the videos as a workflow artifact (render)
    default: "true"
outputs:
  folder:
    description: Folder with the videos, subtitles, posters and manifests
    value: ${{ steps.run.outputs.folder }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with: { node-version: 22 }
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
    - if: runner.os == 'macOS'
      shell: bash
      run: brew install ffmpeg
    - shell: bash
      env: { VERSION: "${{ inputs.version }}", VOICES: "${{ inputs.voices }}" }
      run: |
        npm install -g "tourwright@$VERSION"
        tourwright install --yes --voices "$VOICES"
        if [ "$RUNNER_OS" = "Linux" ]; then sudo env "PATH=$PATH" npx -y playwright install-deps chromium; fi
    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        SCRIPTS: ${{ inputs.scripts }}
        OUT: ${{ inputs.out }}
        VOICE: ${{ inputs.voice }}
        QUALITY: ${{ inputs.quality }}
        EXPORT: ${{ inputs.export }}
        FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
      run: |
        shopt -s globstar nullglob
        files=()
        for pattern in $SCRIPTS; do files+=($pattern); done
        if [ ${#files[@]} -eq 0 ]; then echo "::error::no scripts match: $SCRIPTS"; exit 1; fi
        echo "folder=$OUT" >> "$GITHUB_OUTPUT"
        if [ "$COMMAND" = "check" ]; then
          tourwright check "${files[@]}"
          exit
        fi
        status=0
        for f in "${files[@]}"; do
          if [ "$COMMAND" = "guide" ]; then
            args=(guide "$f" --out "$OUT/$(basename "${f%.*}")/" --compare)
            [[ ",$EXPORT," == *",pdf,"* ]] && args+=(--pdf)
            [[ ",$EXPORT," == *",docx,"* ]] && args+=(--docx)
            [ "$FAIL_ON_CHANGE" = "true" ] && args+=(--fail-on-change)
            tourwright "${args[@]}" || status=1
            continue
          fi
          args=(render "$f" --out "$OUT/$(basename "${f%.*}")/")
          [ -n "$VOICE" ] && args+=(--voice "$VOICE")
          [ -n "$QUALITY" ] && args+=(--quality "$QUALITY")
          [ -n "$EXPORT" ] && args+=(--export "$EXPORT")
          tourwright "${args[@]}"
        done
        exit $status
    - if: (inputs.command == 'render' || inputs.command == 'guide') && inputs.upload == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: tourwright-videos
        path: ${{ inputs.out }}
